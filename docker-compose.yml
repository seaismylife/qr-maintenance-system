version: "3.8"
services:
  db:
    image: mysql:8.0
    container_name: qr_maintenance_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_pass_123}
      MYSQL_DATABASE: ${MYSQL_DB:-qr_maintenance_db}
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_secure_pass_123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qr_maintenance_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-appuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app_secure_pass_123}
      MYSQL_DB: ${MYSQL_DB:-qr_maintenance_db}
      MYSQL_POOL_SIZE: 10
      SECRET_KEY: ${SECRET_KEY:-prod_qr_maintenance_super_secure_key_2026}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5000}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-0}
      BEHIND_PROXY: ${BEHIND_PROXY:-0}
      PROXY_FIX_NUM_PROXIES: ${PROXY_FIX_NUM_PROXIES:-1}
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      - app_uploads:/app/uploads
volumes:
  mysql_data:
    driver: local
  app_uploads:
    driver: local
