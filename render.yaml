services:
  - type: web
    name: qr-maintenance-system
    env: python
    plan: free
    region: oregon
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python init_db.py --seed && gunicorn wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --worker-class gthread --keep-alive 5"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB
        sync: false
      - key: MYSQL_SSL_DISABLED
        value: "0"
      - key: BEHIND_PROXY
        value: "1"
      - key: PROXY_FIX_NUM_PROXIES
        value: "1"
      - key: PUBLIC_BASE_URL
        sync: false

