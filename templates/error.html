{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 650px; margin: 40px auto; text-align: center; padding: 48px 32px;">
    <div style="width: 70px; height: 70px; border-radius: 50%; background: var(--danger-soft, rgba(239,68,68,0.12)); color: var(--danger, #ef4444); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
        {% if code == 403 %}
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        {% elif code == 404 %}
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {% else %}
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        {% endif %}
    </div>
    <span class="badge badge-danger" style="font-size: 0.85rem; font-weight: 800; padding: 4px 12px; margin-bottom: 12px; display: inline-block;">
        Error {{ code }}
    </span>
    <h2 style="font-size: 1.45rem; font-weight: 800; margin-bottom: 10px; color: var(--text);">{{ title }}</h2>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 28px; line-height: 1.6;">
        {{ message }}
    </p>
    <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
        <button type="button" class="btn" onclick="window.history.length > 1 ? window.history.back() : window.location.href='/'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            Go Back
        </button>
        {% if user %}
        <a href="{{ url_for('dashboard.' ~ user.role) }}" class="btn secondary">
            Return to Dashboard
        </a>
        {% else %}
        <a href="{{ url_for('auth.login') }}" class="btn secondary">
            Sign In
        </a>
        {% endif %}
    </div>
</div>
{% endblock %}
